[cameras.qos_profiles]
QCI_1_voice = {qos_profile_name = "QCI_1_voice", max_ul_bitrate = "20000 Kbps", max_dl_bitrate = "20000 Kbps"}
QCI_2_voice = {qos_profile_name = "QCI_2_voice", max_ul_bitrate = "25000 Kbps", max_dl_bitrate = "25000 Kbps"}

[cameras.qos_profiles_assignment]
# Apart from default and fallback, the keys are UE supi values (see nef_db_init.sh).
# fallback (optional) replaces a camera's QoD provisioning once an analytics breach is detected.
default              = "QCI_1_voice"
fallback             = "QCI_2_voice"

[cameras.surveyed_areas]
# Apart from default, the keys are UE supi values (see nef_db_init.sh).
# Geofencing area per camera UE supi (radius in metres; optional polygon points for the NEF backend).
# The circle center is the camera's live location; radius is always used by the CAMARA backend.
default              = {radius = 300}
"999080100001127"    = {radius = 500, points = [{latitude = 40.63, longitude = -8.65}, {latitude = 40.64, longitude = -8.64}, {latitude = 40.63, longitude = -8.63}]}  # scamera-1

[cameras.stream_requirements]
# Apart from default, the keys are UE supi values (see nef_db_init.sh).
# Minimum bitrates the camera stream needs; below them an analytics breach is detected.
default              = {min_ul_bitrate = "15000 Kbps", min_dl_bitrate = "15000 Kbps"}

[cameras.inference]
# Apart from default, the keys are UE supi values (see nef_db_init.sh).
default              = {inference_enabled = false}
"999080100001127"    = {inference_enabled = true, stream_protocol = "rtsp", stream_ip = "10.16.9.25", stream_port = 8554, stream_path = "mystream", max_fps = 15}  # scamera-1
