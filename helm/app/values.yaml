# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: migas77/vehicle-crash-detection-poc-app
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

ingress:
  # DEFAULT enabled and setted up for using nginx ingress controller
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: crash-detection-poc.local
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: config
    secret:
      secretName: '{{ include "app.configSecretName" . }}'

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: config
    mountPath: /code/config.toml
    subPath: config.toml
    readOnly: true
  - name: config
    mountPath: /code/cameras.toml
    subPath: cameras.toml
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# CAPIF integration. There is no on/off switch here: everything below is only
# rendered when config.configToml sets [net_apis] auth_mode = "capif", which is
# what makes the PoC onboard as a CAPIF API invoker (service discovery, invoker
# token, mTLS client certificate) in the first place.
capif:
  # Offboard the invoker from CAPIF core on pod shutdown (SIGTERM), e.g. on
  # helm uninstall/rollout - so CAPIF core doesn't accumulate stale invokers.
  cleanupOnShutdown: true
  # The onboarding certificates are written under invoker/<capif.username>/ at
  # runtime and shared via this hostPath, so the pod MUST land on the same node
  # across restarts (pin it with nodeSelector on a single-node/dev cluster).
  hostPath: /mnt/crash-detection-poc-capif-certs
  # capif.host MUST stay the hostname CAPIF's nginx serves its cert for
  # (CAPIF_HOSTNAME in capif/helm/scripts/variables.sh): the SDK verifies every
  # call after onboarding against the downloaded ca.crt, which checks this
  # hostname against the cert SAN - a *.svc.cluster.local name fails there.
  # Nothing resolves that name, so it is mapped to an address via the pod's
  # hostAliases - see ingressIP.
  host: capif.testbed.develop
  # registerHost needs no alias: the SDK reaches register on its ClusterIP
  # service port (8084, not via the ingress) and calls getauth with
  # verify=False, so plain cluster DNS is enough here.
  registerHost: register.ocf-capif.svc.cluster.local
  # Address capif.host resolves to, injected as a hostAlias on the PoC pod. Use
  # the ingress-nginx controller ClusterIP - it lives outside the ocf-capif
  # namespace and so survives CAPIF reinstalls:
  #   kubectl get svc -A | awk '/ingress-nginx-controller/ {print $4; exit}'
  # Left empty the hostAliases block is omitted entirely and onboarding fails
  # with "Name or service not known".
  ingressIP: ""
  httpsPort: "443"
  registerPort: "8084"
  # Must match an account created by capif/helm/scripts/06_create_capif_users.sh
  # (CAPIF_APP_USERS in capif/helm/scripts/variables.sh)
  username: poc-invoker
  # password should be overridden with --set capif.password=... or a values override file, not committed here
  password: password

config:
  camerasToml: ""
  configToml: ""

