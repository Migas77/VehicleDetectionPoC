# templates/config-secret.yaml
{{- if or .Values.config.configToml .Values.config.camerasToml }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.configSecretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
{{ tpl .Values.config.configToml . | indent 4 }}
  cameras.toml: |
{{ tpl .Values.config.camerasToml . | indent 4 }}
{{- end }}